name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,api]"
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pdf-to-excel .
      - name: start the container, call /health and /extract, check it is not root
        run: |
          docker run -d --name api -p 8000:8000 pdf-to-excel
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health
          curl -sf -F "file=@samples/invoices/01_classic_us.pdf" localhost:8000/extract | grep -q '"status":"OK"'
          test "$(docker exec api id -u)" != "0"
      - if: failure()
        run: docker logs api
