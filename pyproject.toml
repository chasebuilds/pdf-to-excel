[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-excel"
version = "0.1.0"
description = "Invoice PDFs to one Excel workbook, with a confidence score on every field and a review sheet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chase Builds" }]
dependencies = [
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "reportlab>=4",
    "pymupdf>=1.24",
    "mypy>=1.10",
    "types-openpyxl",
    "pytest-cov>=5",
]

[project.scripts]
pdf-to-excel = "pdf_to_excel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_excel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["src/pdf_to_excel"]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["pdf_to_excel"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "benchmark", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pdf_to_excel", "benchmark"]

[tool.ruff.lint.per-file-ignores]
# report text and dense drawing code read better unwrapped
"benchmark/*.py" = ["E501"]
